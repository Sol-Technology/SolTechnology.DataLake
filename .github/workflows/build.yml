name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build SolTechnology.DataLake.slnx -c Release
    - name: Unit tests
      run: |
        dotnet test tests/SolTechnology.DataLake.UnitTests -c Release --no-build
        dotnet test spikes/IcebergSpike.Tests -c Release --no-build

  integration:
    # Linux containers through Testcontainers: Silo (S3), Lakekeeper (REST catalog), Trino, PyIceberg.
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Integration tests
      run: dotnet test tests/SolTechnology.DataLake.IntegrationTests -c Release --logger "console;verbosity=normal"
